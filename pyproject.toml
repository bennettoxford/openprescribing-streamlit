[project]
name = "openprescribing-streamlit"
version = "0.1.0"
description = "A Streamlit application for working with OpenPrescribing data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.61.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
